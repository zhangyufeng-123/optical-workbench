name: 改进建议
description: 说明使用场景和希望改进的地方。
title: "[建议] "
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你正在完成什么工作，在哪一步遇到不便？
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 希望如何改进
      description: 可附示意图或例子。
    validations:
      required: true
